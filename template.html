<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Portfolio | Christina Lilligren</title>
    <style>
        /* ==========================================================================
           1. RESET & BASE STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           2. NAVIGATION HEADER
           ========================================================================== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #000000;
            color: white;
            position: relative;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #3498db;
        }

        /* Mobile Menu Triggers (Hidden on Desktop) */
        .menu-toggle {
            display: none;
        }

        .hamburger-label {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 5px;
        }

        .hamburger-label span {
            display: block;
            width: 25px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        /* ==========================================================================
           3. MAIN CONTENT
           ========================================================================== */
        .main-content {
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
            flex: 1; /* Pushes footer down on short pages */
        }

        .main-content h1 {
            font-size: 2.5rem;
            color: #000000;
            margin-bottom: 20px;
        }

        .main-content p {
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        /* ==========================================================================
           4. FOOTER
           ========================================================================== */
        .footer {
            background-color: #000000;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-text {
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        .footer-socials {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        .footer-socials a {
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .footer-socials svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .footer-socials a:hover {
            color: #3498db;
            transform: scale(1.1);
        }

        /* ==========================================================================
           5. RESPONSIVE DESIGN (MOBILE VIEW)
           ========================================================================== */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .hamburger-label {
                display: flex;
            }

            /* Transforms desktop links into a mobile dropdown panel */
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                background-color: #2c3e50;
                position: absolute;
                top: 100%;
                left: 0;
                padding: 20px;
                gap: 15px;
                border-top: 1px solid #34495e;
                box-shadow: 0 4px 6px rgba(0,0,0,0.15);
                z-index: 1001;
            }

            /* CSS Hack: Displays the dropdown menu when the hidden checkbox is clicked */
            .menu-toggle:checked ~ .nav-links {
                display: flex;
            }

            /* Animates hamburger icon lines into an 'X' */
            .menu-toggle:checked + .hamburger-label span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 6px);
            }

            .menu-toggle:checked + .hamburger-label span:nth-child(2) {
                opacity: 0;
            }

            .menu-toggle:checked + .hamburger-label span:nth-child(3) {
                transform: rotate(-45deg) translate(5px, -6px);
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <a href="index.html" class="logo">[Your Logo]</a>
        
        <!-- Mobile Dropdown System Mechanics -->
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger-label">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <!-- Navigation Menu Links -->
        <nav class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
        </nav>
    </header>

    <!-- Main Dynamic Content Wrapper -->
    <main class="main-content">
        <h1>[Main Page Heading]</h1>
        <p>This is a placeholder paragraph. Swap this block of text out on individual pages to fit your layout requirements.</p>
    </main>

    <!-- Footer Area -->
    <footer class="footer">
        <p class="footer-text">&copy; 2026 [Your Name]. All rights reserved.</p>
        
        <!-- Social Profiles / External Networks Area -->
        <ul class="footer-socials">
            <li>
                <a href="[Your_Link]" target="_blank" aria-label="Social Link 1">
                    <!-- Placeholder Box SVG Graphic -->
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </a>
            </li>
            <li>
                <a href="[Your_Link]" target="_blank" aria-label="Social Link 2">
                    <!-- Placeholder Box SVG Graphic -->
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                </a>
            </li>
        </ul>
    </footer>

</body>
</html>
