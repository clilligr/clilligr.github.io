<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Portfolio</title>
    <!-- Modern Inter Font for sleek typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary-accent: #0284c7; /* Professional Slate Blue */
            --primary-hover: #0369a1;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        .portfolio-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .portfolio-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .portfolio-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .meta-info {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .meta-info span {
            margin: 0 8px;
            color: #cbd5e1; /* Subtle divider color */
        }

        .meta-info a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .meta-info a:hover {
            color: var(--primary-accent);
        }

        /* Clean wrapper layout for app and details card */
        .showcase-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        /* Sleek container to hold the Experience Builder App */
        .embed-container { 
            position: relative; 
            padding-bottom: 56.25%; /* Clean 16:9 Aspect Ratio */
            height: 0; 
            overflow: hidden; 
            background: #f1f5f9;
            border-bottom: 1px solid var(--border-color);
        }

        .embed-container iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border: 0; 
        }

        /* Modern typography for project details card */
        .project-card { 
            padding: 32px; 
        }

        .project-card h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 12px;
            letter-spacing: -0.01em;
        }

        .project-card p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 24px;
            max-width: 800px;
        }

        /* Styled Action Button instead of a basic link */
        .action-button {
            display: inline-flex;
            align-items: center;
            background-color: var(--primary-accent);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: var(--shadow-sm);
        }

        .action-button:hover {
            background-color: var(--primary-hover);
        }

        .action-button:active {
            transform: scale(0.98);
        }

        .action-button svg {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        
        <div class="portfolio-header">
            <h1>GIS Portfolio</h1>
            <div class="meta-info">
                <strong>Your Name Here</strong>
                <span>•</span>
                <a href="mailto:your.email@example.com">your.email@example.com</a>
                <span>•</span>
                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            </div>
        </div>

        <div class="showcase-wrapper">
            <!-- Live ArcGIS Experience Builder App Frame -->
            <div class="embed-container">
                <iframe src="https://arcgis.com" 
                        allowfullscreen 
                        sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
                </iframe>
            </div>

            <!-- Project Context Information Card -->
            <div class="project-card">
                <h3>Featured Project: Interactive GIS Experience</h3>
                <p>This dynamic platform leverages ArcGIS Experience Builder to host responsive data pipelines, web maps, and widget toolsets in a uniform production layout.</p>
                
                <a class="action-button" href="https://arcgis.com" target="_blank" rel="noopener noreferrer">
                    <!-- Inline External Link Icon -->
                    <svg viewBox="0 0 20 20" xmlns="http://w3.org">
                        <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
                        <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/>
                    </svg>
                    Open Application in New Tab
                </a>
            </div>
        </div>

    </div>

</body>
</html>
