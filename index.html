<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christina Lilligren | GIS Professional</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary-accent: #0284c7;
            --primary-hover: #0369a1;
            --border-color: #e2e8f0;
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            margin: 20px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: var(--primary-accent);
            font-weight: 500;
            margin-bottom: 24px;
        }
        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .meta-info {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }
        .meta-info a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .meta-info a:hover { color: var(--primary-accent); }
        .meta-info span { color: #cbd5e1; }
        .btn {
            display: inline-flex;
            align-items: center;
            background-color: var(--primary-accent);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn svg { margin-left: 8px; width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>Christina Lilligren</h1>
        <div class="subtitle">GIS Analyst & Developer</div>
        
        <p>Welcome to my geospatial portfolio. I specialize in design workflows, spatial analysis pipelines, and translating complex map metadata into interactive browser environments for public and private stakeholders.</p>
        
        <div class="meta-info">
            <a href="mailto:christinalilligren@gmail.com">Email</a>
            <span>•</span>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </div>

        <!-- Links directly to your maps page -->
        <a href="portfolio.html" class="btn">
            View Interactive Maps
            <svg viewBox="0 0 20 20" xmlns="http://w3.org">
                <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
        </a>
    </div>

</body>
</html>
